---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# nexus-staging-action
name: '🚀 Nexus Staging'
description: 'Manage Sonatype Nexus staging repository lifecycle'

inputs:
  nexus-server:
    description: 'Nexus server URL (e.g., https://nexus.opendaylight.org)'
    required: true
  nexus-username:
    description: 'Nexus username for authentication'
    required: true
  nexus-password:
    description: 'Nexus password for authentication'
    required: true
  staging-profile-id:
    description: 'Nexus staging profile ID (per-project)'
    required: true
  mode:
    description: 'Operation mode: stage, close, release, drop'
    required: true
    default: 'stage'
  m2repo-path:
    description: 'Path to local Maven repo directory (for stage mode)'
    required: false
    default: 'm2repo'
  staging-repo-id:
    description: 'Existing staging repo ID (for close/release/drop modes)'
    required: false
    default: ''
  staging-repo-file:
    description: >
      Path to a staging-repo.txt file listing one or more staging repos
      (one "REPO_ID REPO_URL" per line, as written by stage mode). When set,
      close/release/drop operate on every repo in the file. Mirrors the JJB
      behaviour of releasing all repos listed in staging-repo.txt.
    required: false
    default: ''
  dry-run:
    description: >
      When 'true', verify the staging repo(s) exist but do NOT perform the
      mutating operation (no close/release/drop). Mirrors JJB DRY_RUN.
    required: false
    default: 'false'
  description:
    description: 'Description for the staging repository'
    required: false
    default: 'GitHub Actions staging'
  close-timeout:
    description: >
      Seconds to wait for Nexus to finish closing a staging repository
      (stage and close modes) before failing the step, from 1 to 86400.
      Also caps the 30s limit on the drop a failed stage makes.
    required: false
    default: '600'
  close-poll-interval:
    description: >
      Seconds between checks of the close status (stage and close modes),
      from 1 to 86400.
    required: false
    default: '10'

outputs:
  staging_repo_id:
    description: 'Staging repository ID'
    value: ${{ steps.nexus.outputs.staging_repo_id }}
  staging_repo_url:
    description: 'Staging repository URL'
    value: ${{ steps.nexus.outputs.staging_repo_url }}

runs:
  using: 'composite'
  steps:
    - name: 'Validate inputs'
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_M2REPO_PATH: ${{ inputs.m2repo-path }}
        INPUT_STAGING_REPO_ID: ${{ inputs.staging-repo-id }}
        INPUT_STAGING_REPO_FILE: ${{ inputs.staging-repo-file }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_CLOSE_TIMEOUT: ${{ inputs.close-timeout }}
        INPUT_CLOSE_POLL_INTERVAL: ${{ inputs.close-poll-interval }}
      run: |
        # SPDX-License-Identifier: Apache-2.0
        set -euo pipefail

        echo "---> nexus-staging: Validating inputs"

        case "$INPUT_MODE" in
          stage|close|release|drop)
            ;;
          promote)
            echo "::warning::mode 'promote' is deprecated; use 'release'"
            ;;
          *)
            echo "::error::Invalid mode: $INPUT_MODE" \
              "(must be: stage, close, release, drop)"
            exit 1
            ;;
        esac

        case "$INPUT_DRY_RUN" in
          true|false) ;;
          *)
            echo "::error::Invalid dry-run: $INPUT_DRY_RUN (must be true/false)"
            exit 1
            ;;
        esac

        # Accept 1..86400. Check the digit count before any arithmetic:
        # Bash wraps at 2^64, so a huge value would otherwise pass as a
        # small one (18446744073709551617 evaluates to 1).
        require_positive_integer() {
          local digits="${2#"${2%%[!0]*}"}"
          case "$2" in
            ''|*[!0-9]*) ;;
            *)
              if [ -n "$digits" ] && [ "${#digits}" -le 5 ] \
                  && [ "$((10#$digits))" -le 86400 ]; then
                return 0
              fi
              ;;
          esac
          echo "::error::Invalid $1: $2 (must be an integer from 1 to 86400)"
          exit 1
        }
        require_positive_integer close-timeout "$INPUT_CLOSE_TIMEOUT"
        require_positive_integer close-poll-interval \
          "$INPUT_CLOSE_POLL_INTERVAL"

        if [ "$INPUT_MODE" = "stage" ]; then
          if [ ! -d "$INPUT_M2REPO_PATH" ]; then
            echo "::error::m2repo-path directory not found: $INPUT_M2REPO_PATH"
            exit 1
          fi
          FILE_COUNT=$(find "$INPUT_M2REPO_PATH" -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::m2repo-path is empty: $INPUT_M2REPO_PATH"
            exit 1
          fi
          echo "INFO: Found $FILE_COUNT files in $INPUT_M2REPO_PATH"
        fi

        if [ "$INPUT_MODE" != "stage" ]; then
          if [ -z "$INPUT_STAGING_REPO_ID" ] \
              && [ -z "$INPUT_STAGING_REPO_FILE" ]; then
            echo "::error::staging-repo-id or staging-repo-file is required" \
              "for mode: $INPUT_MODE"
            exit 1
          fi
          if [ -n "$INPUT_STAGING_REPO_FILE" ] \
              && [ ! -f "$INPUT_STAGING_REPO_FILE" ]; then
            echo "::error::staging-repo-file not found:" \
              "$INPUT_STAGING_REPO_FILE"
            exit 1
          fi
        fi

    - name: 'Execute Nexus staging operation'
      id: nexus
      shell: bash
      env:
        INPUT_NEXUS_SERVER: ${{ inputs.nexus-server }}
        INPUT_NEXUS_USERNAME: ${{ inputs.nexus-username }}
        INPUT_NEXUS_PASSWORD: ${{ inputs.nexus-password }}
        INPUT_STAGING_PROFILE_ID: ${{ inputs.staging-profile-id }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_M2REPO_PATH: ${{ inputs.m2repo-path }}
        INPUT_STAGING_REPO_ID: ${{ inputs.staging-repo-id }}
        INPUT_STAGING_REPO_FILE: ${{ inputs.staging-repo-file }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        INPUT_CLOSE_TIMEOUT: ${{ inputs.close-timeout }}
        INPUT_CLOSE_POLL_INTERVAL: ${{ inputs.close-poll-interval }}
      run: |
        # SPDX-License-Identifier: Apache-2.0
        set -euo pipefail

        echo "---> nexus-staging: mode=$INPUT_MODE"

        # Back-compat: 'promote' is the deprecated alias for 'release'
        if [ "$INPUT_MODE" = "promote" ]; then
          INPUT_MODE="release"
        fi

        # Mask credentials
        echo "::add-mask::${INPUT_NEXUS_PASSWORD}"

        NEXUS_SERVER="${INPUT_NEXUS_SERVER%/}"
        AUTH="${INPUT_NEXUS_USERNAME}:${INPUT_NEXUS_PASSWORD}"
        PROFILE_ID="${INPUT_STAGING_PROFILE_ID}"
        STAGING_API="${NEXUS_SERVER}/service/local/staging"
        CLOSE_TIMEOUT=$((10#${INPUT_CLOSE_TIMEOUT}))
        CLOSE_POLL_INTERVAL=$((10#${INPUT_CLOSE_POLL_INTERVAL}))

        # Build list of staging repo IDs from explicit id and/or file.
        # The file format matches stage-mode output: "REPO_ID REPO_URL".
        build_repo_ids() {
            REPO_IDS=()
            if [ -n "${INPUT_STAGING_REPO_ID}" ]; then
                REPO_IDS+=("${INPUT_STAGING_REPO_ID}")
            fi
            if [ -n "${INPUT_STAGING_REPO_FILE}" ]; then
                while IFS= read -r line || [ -n "$line" ]; do
                    # First whitespace-delimited field is the repo ID
                    rid="$(echo "$line" | awk '{print $1}')"
                    [ -n "$rid" ] && REPO_IDS+=("$rid")
                done < "${INPUT_STAGING_REPO_FILE}"
            fi
            if [ "${#REPO_IDS[@]}" -eq 0 ]; then
                echo "::error::No staging repo IDs resolved"
                exit 1
            fi
        }

        # Escape the XML special characters & < > " ' in $1.
        xml_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g' -e 's/"/\&quot;/g' -e "s/'/\&apos;/g"
        }

        # Send a request to Nexus. Arguments: URL, then extra curl options.
        # Sets HTTP_CODE ("000" when no response arrived) and HTTP_BODY.
        nexus_request() {
            local url="$1" response
            shift
            response=$(curl -s -u "$AUTH" -w '\n%{http_code}' "$@" "$url") \
                || true
            HTTP_CODE="${response##*$'\n'}"
            HTTP_BODY="${response%$'\n'*}"
        }

        # POST a promoteRequest to /profiles/<id>/<op> (op: finish or drop)
        # for repository $2 with description $3; any further arguments are
        # extra curl options. Succeeds on HTTP 2xx.
        staging_profile_op() {
            local op="$1" rid="$2" desc="$3" xml
            shift 3
            xml="<promoteRequest><data>"
            xml+="<stagedRepositoryId>$(xml_escape "$rid")</stagedRepositoryId>"
            xml+="<description>$(xml_escape "$desc")</description>"
            xml+="</data></promoteRequest>"
            nexus_request "${STAGING_API}/profiles/${PROFILE_ID}/${op}" \
                -H "Content-Type: application/xml" -d "$xml" "$@"
            case "$HTTP_CODE" in
                2??) return 0 ;;
            esac
            echo "Response: ${HTTP_BODY:0:500}"
            return 1
        }

        # Print, one per line, each close activity in the activity XML $1
        # that comes after the first $2 close activities.
        close_activities_after() {
            printf '%s' "$1" | tr '\r\n' '  ' | awk -v skip="$2" '
                BEGIN { RS = "<stagingActivity>" }
                NR > 1 && /^[[:space:]]*<name>close<\/name>/ {
                    if (++seen > skip) print
                }'
        }

        # Print the rule failure messages found in close activity XML $1.
        report_rule_failures() {
            local messages msg
            messages=$(printf '%s' "$1" | grep -oE \
                '<name>failureMessage</name>[[:space:]]*<value>[^<]*</value>' \
                | sed -e 's:.*<value>::' -e 's:</value>$::' \
                    -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&quot;/"/g' \
                    -e "s/&apos;/'/g" -e 's/&amp;/\&/g' || true)
            if [ -z "$messages" ]; then
                echo "INFO: The activity log records no rule failure messages"
                return 0
            fi
            while IFS= read -r msg; do
                echo "::error::Staging rule failure: ${msg}"
            done <<< "$messages"
        }

        # Wait for Nexus to finish closing repository $1, which closes
        # asynchronously after /finish. $2 counts the close activities the
        # repository had before the request: an earlier failed close attempt
        # must not fail this one. Succeeds on type=closed with
        # transitioning=false; fails on a rule or close failure or timeout.
        # The time left before the deadline bounds every request and sleep,
        # so a Nexus that stops answering cannot outlast close-timeout.
        wait_for_close() {
            local rid="$1" baseline="$2" deadline flat state transitioning
            local attempts remaining
            deadline=$((SECONDS + CLOSE_TIMEOUT))
            echo "INFO: Waiting up to ${CLOSE_TIMEOUT}s for ${rid} to close"
            while true; do
                state="unknown"
                transitioning="unknown"
                remaining=$((deadline - SECONDS))
                [ "$remaining" -gt 0 ] || remaining=1
                nexus_request "${STAGING_API}/repository/${rid}" \
                    -H "Accept: application/xml" --max-time "$remaining"
                case "$HTTP_CODE" in
                    200)
                        flat=$(printf '%s' "$HTTP_BODY" | tr '\r\n' '  ')
                        state=$(printf '%s' "$flat" \
                            | sed -n 's:.*<type>\([^<]*\)</type>.*:\1:p')
                        transitioning=$(printf '%s' "$flat" | sed -n \
                            's:.*<transitioning>\([^<]*\)</transitioning>.*:\1:p')
                        ;;
                    404)
                        echo "::error::Staging repository ${rid} not found" \
                            "while waiting for it to close"
                        return 1
                        ;;
                    *)
                        echo "::warning::Status check of ${rid} returned" \
                            "HTTP ${HTTP_CODE}; retrying"
                        ;;
                esac

                if [ "$transitioning" = "false" ]; then
                    if [ "$state" = "closed" ]; then
                        echo "INFO: Staging repository ${rid} closed"
                        return 0
                    fi
                    remaining=$((deadline - SECONDS))
                    [ "$remaining" -gt 0 ] || remaining=1
                    nexus_request "${STAGING_API}/repository/${rid}/activity" \
                        -H "Accept: application/xml" --max-time "$remaining"
                    if [ "$HTTP_CODE" = "200" ]; then
                        attempts=$(close_activities_after "$HTTP_BODY" \
                            "$baseline")
                        case "$attempts" in
                            *'<name>ruleFailed</name>'* \
                            | *'<name>repositoryCloseFailed</name>'*)
                                echo "::error::Nexus failed to close ${rid}:" \
                                    "one or more staging rules failed"
                                report_rule_failures "$attempts"
                                return 1
                                ;;
                        esac
                    fi
                fi

                if [ "$SECONDS" -ge "$deadline" ]; then
                    echo "::error::Timed out after ${CLOSE_TIMEOUT}s waiting" \
                        "for ${rid} to close (type=${state:-unknown}," \
                        "transitioning=${transitioning:-unknown})"
                    return 1
                fi
                remaining=$((deadline - SECONDS))
                if [ "$remaining" -gt "$CLOSE_POLL_INTERVAL" ]; then
                    remaining="$CLOSE_POLL_INTERVAL"
                fi
                echo "INFO: ${rid}: type=${state:-unknown}" \
                    "transitioning=${transitioning:-unknown};" \
                    "checking again in ${remaining}s"
                sleep "$remaining"
            done
        }

        # Request the close of repository $1 (description $2), then wait
        # for Nexus to report the outcome. $3, when given, counts the earlier
        # close attempts; otherwise read them from the activity log, and
        # refuse to close when that fails rather than risk blaming this
        # close for an earlier attempt's rule failures.
        close_repository() {
            local rid="$1" desc="$2" baseline="${3:-}"
            if [ -z "$baseline" ]; then
                nexus_request "${STAGING_API}/repository/${rid}/activity" \
                    -H "Accept: application/xml" --max-time "$CLOSE_TIMEOUT"
                if [ "$HTTP_CODE" != "200" ]; then
                    echo "::error::Cannot read the activity of ${rid}" \
                        "(HTTP ${HTTP_CODE}); not requesting its close"
                    return 1
                fi
                baseline=$(close_activities_after "$HTTP_BODY" 0 | wc -l)
                baseline=$((baseline))
            fi
            if ! staging_profile_op finish "$rid" "$desc" \
                --max-time "$CLOSE_TIMEOUT"; then
                echo "::error::Close request for ${rid} failed" \
                    "(HTTP ${HTTP_CODE})"
                return 1
            fi
            echo "INFO: Nexus accepted the close request for ${rid}"
            wait_for_close "$rid" "$baseline"
        }

        # Stage mode sets this once it has created a staging repository and
        # clears it on success. If the step fails while it is set, drop the
        # repository so failed runs leave no open repositories behind. The
        # drop gives up after 30s, or after close-timeout when that is
        # shorter, and the original exit status survives whatever the drop
        # does.
        STAGED_REPO_ID=""
        drop_failed_stage() {
            local rc=$? drop_timeout=30
            if [ "$rc" -ne 0 ] && [ -n "$STAGED_REPO_ID" ]; then
                echo "INFO: Stage failed after creating staging repository" \
                    "${STAGED_REPO_ID}; dropping it"
                if [ "$CLOSE_TIMEOUT" -lt "$drop_timeout" ]; then
                    drop_timeout="$CLOSE_TIMEOUT"
                fi
                if staging_profile_op drop "$STAGED_REPO_ID" \
                    "Drop failed stage: ${INPUT_DESCRIPTION}" \
                    --max-time "$drop_timeout"; then
                    echo "INFO: Dropped staging repository ${STAGED_REPO_ID}"
                else
                    echo "::warning::Could not drop staging repository" \
                        "${STAGED_REPO_ID} (HTTP ${HTTP_CODE}); drop it by hand"
                fi
            fi
            exit "$rc"
        }

        # ─── STAGE MODE ────────────────────────────────────────
        if [ "$INPUT_MODE" = "stage" ]; then
            echo "INFO: Creating staging repository..."

            # Step 1: Create staging repo
            XML_DATA="<promoteRequest><data>"
            XML_DATA+="<description>"
            XML_DATA+="$(xml_escape "${INPUT_DESCRIPTION}")"
            XML_DATA+="</description>"
            XML_DATA+="</data></promoteRequest>"
            nexus_request "${STAGING_API}/profiles/${PROFILE_ID}/start" \
                -H "Content-Type: application/xml" \
                -H "Accept: application/xml" \
                -d "$XML_DATA"
            CREATE_RESPONSE="$HTTP_BODY"
            case "$HTTP_CODE" in
                2??) ;;
                *)
                    echo "::error::Failed to create staging repository" \
                        "(HTTP ${HTTP_CODE})"
                    echo "Response: ${CREATE_RESPONSE:0:500}"
                    exit 1
                    ;;
            esac

            REPO_ID=$(echo "$CREATE_RESPONSE" \
                | grep -oP \
                '<stagedRepositoryId>\K[^<]+' \
                || echo "$CREATE_RESPONSE" \
                | sed -n \
                's/.*<stagedRepositoryId>\(.*\)<\/stagedRepositoryId>.*/\1/p')

            if [ -z "$REPO_ID" ]; then
                echo "::error::Failed to create staging repository"
                echo "Response: $CREATE_RESPONSE"
                exit 1
            fi
            echo "INFO: Staging repository ${REPO_ID} created"
            STAGED_REPO_ID="$REPO_ID"
            trap drop_failed_stage EXIT

            # Step 2: Upload artifacts. A staging repository missing files
            # must never close, so the first failed upload fails the step.
            DEPLOY_URL="${NEXUS_SERVER}/service/local/staging"
            DEPLOY_URL+="/deployByRepositoryId/${REPO_ID}"
            UPLOAD_COUNT=0

            while IFS= read -r -d '' file; do
                rel_path="${file#"${INPUT_M2REPO_PATH}"/}"
                nexus_request "${DEPLOY_URL}/${rel_path}" \
                    --upload-file "$file"
                case "$HTTP_CODE" in
                    2??) UPLOAD_COUNT=$((UPLOAD_COUNT + 1)) ;;
                    *)
                        echo "::error::Failed to upload ${rel_path}" \
                            "(HTTP ${HTTP_CODE})"
                        exit 1
                        ;;
                esac
            done < <(find "$INPUT_M2REPO_PATH" -type f -print0)

            echo "INFO: Uploaded ${UPLOAD_COUNT} files"

            if [ "$UPLOAD_COUNT" -eq 0 ]; then
                echo "::error::No files to upload in ${INPUT_M2REPO_PATH}"
                exit 1
            fi

            # Step 3: Close staging repo and wait for Nexus to finish. The
            # repository is new, so it has no earlier close attempts.
            echo "INFO: Closing staging repository" \
                "${REPO_ID}..."
            close_repository "$REPO_ID" "Close: ${INPUT_DESCRIPTION}" 0

            REPO_URL="${NEXUS_SERVER}/content/repositories/${REPO_ID}"

            # Write staging-repo.txt (same format as JJB)
            mkdir -p "${GITHUB_WORKSPACE}/archives"
            echo "${REPO_ID} ${REPO_URL}" \
                | tee -a "${GITHUB_WORKSPACE}/archives/staging-repo.txt"

            # Set outputs
            echo "staging_repo_id=${REPO_ID}" >> "$GITHUB_OUTPUT"
            echo "staging_repo_url=${REPO_URL}" >> "$GITHUB_OUTPUT"

            # Summary
            {
                echo "## Nexus Staging Complete ✅"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| **Mode** | stage |"
                echo "| **Repo ID** | \`${REPO_ID}\` |"
                echo "| **Repo URL** | ${REPO_URL} |"
                echo "| **Files Uploaded** | ${UPLOAD_COUNT} |"
            } >> "$GITHUB_STEP_SUMMARY"
            STAGED_REPO_ID=""

        # ─── RELEASE MODE (release closed repos) ──────────────────
        # Ports `lftools nexus release` (nexus/cmd.py release_staging_repos):
        # verify CLOSED state + rule failures, release via /staging/bulk/promote
        # (JSON), then poll activity until the release completes.
        elif [ "$INPUT_MODE" = "release" ]; then

            build_repo_ids
            echo "INFO: Release on ${#REPO_IDS[@]} repo(s)" \
                "(dry-run=${INPUT_DRY_RUN})"

            LAST_REPO_ID=""
            SUMMARY_ROWS=""
            for RID in "${REPO_IDS[@]}"; do
                ACTIVITY_URL="${STAGING_API}/repository/${RID}/activity"

                # Verify repo state before releasing (lftools parity)
                echo "INFO: Verifying staging repository ${RID}..."
                if ! ACTIVITY=$(curl -sf -u "$AUTH" \
                    -H "Accept: application/xml" "$ACTIVITY_URL"); then
                    echo "::error::Verification of ${RID} failed (activity)"
                    exit 1
                fi

                if echo "$ACTIVITY" | grep -q "ruleFailed" \
                    || echo "$ACTIVITY" | grep -q "repositoryCloseFailed"; then
                    echo "::error::One or more staging rules failed for ${RID}"
                    exit 1
                fi

                if echo "$ACTIVITY" | grep -q "repositoryReleased"; then
                    echo "INFO: Repository ${RID} already released; skipping"
                    SUMMARY_ROWS+="| \`${RID}\` | already released |"$'\n'
                    LAST_REPO_ID="${RID}"
                    continue
                fi

                if ! echo "$ACTIVITY" | grep -q "repositoryClosed"; then
                    echo "::error::Repository ${RID} is not in closed state"
                    exit 1
                fi
                echo "INFO: PASS: Repository ${RID} is in closed state"

                if [ "$INPUT_DRY_RUN" = "true" ]; then
                    echo "INFO: [dry-run] would release ${RID} (skipped)"
                    SUMMARY_ROWS+="| \`${RID}\` | verified (dry-run) |"$'\n'
                    LAST_REPO_ID="${RID}"
                    continue
                fi

                # Release via bulk/promote (matches lftools nexus release)
                echo "INFO: Releasing ${RID} via /staging/bulk/promote..."
                RELEASE_JSON="{\"data\":{\"stagedRepositoryIds\":[\"${RID}\"]}}"
                HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                    -u "$AUTH" \
                    -H "Content-Type: application/json" \
                    -d "$RELEASE_JSON" \
                    "${STAGING_API}/bulk/promote")
                if [ "$HTTP_CODE" != "201" ]; then
                    echo "::error::Release of ${RID} failed (HTTP ${HTTP_CODE})"
                    exit 1
                fi
                echo "INFO: Nexus is now releasing ${RID}"

                # Poll activity until the release completes
                sleep 5
                WAIT_SECONDS=20
                WAIT_ITER=0
                MAX_ITER=90
                while true; do
                    POLL=$(curl -sf -u "$AUTH" \
                        -H "Accept: application/xml" "$ACTIVITY_URL" || true)
                    if echo "$POLL" | grep -q "repositoryReleased"; then
                        echo "INFO: Repository ${RID} released"
                        break
                    fi
                    WAIT_ITER=$((WAIT_ITER + 1))
                    if [ "$WAIT_ITER" -ge "$MAX_ITER" ]; then
                        echo "::error::Timed out waiting for ${RID} to release"
                        exit 1
                    fi
                    sleep "$WAIT_SECONDS"
                    ELAPSED=$((WAIT_SECONDS * WAIT_ITER))
                    echo "INFO: Still waiting... ${ELAPSED}s gone"
                done

                SUMMARY_ROWS+="| \`${RID}\` | released |"$'\n'
                LAST_REPO_ID="${RID}"
            done

            REPO_URL="${NEXUS_SERVER}/content/repositories/${LAST_REPO_ID}"
            echo "staging_repo_id=${LAST_REPO_ID}" >> "$GITHUB_OUTPUT"
            echo "staging_repo_url=${REPO_URL}" >> "$GITHUB_OUTPUT"

            {
                echo "## Nexus Staging Release ✅"
                echo ""
                echo "| Repo ID | Result |"
                echo "|---|---|"
                printf '%s' "${SUMMARY_ROWS}"
                echo ""
                echo "_dry-run: ${INPUT_DRY_RUN}_"
            } >> "$GITHUB_STEP_SUMMARY"

        # ─── CLOSE / DROP MODES (loop over repo list) ──────────────
        elif [ "$INPUT_MODE" = "close" ] || [ "$INPUT_MODE" = "drop" ]; then

            build_repo_ids

            case "$INPUT_MODE" in
                close) ACTION_VERB="Close" ;;
                drop)  ACTION_VERB="Drop" ;;
            esac

            echo "INFO: ${ACTION_VERB} on ${#REPO_IDS[@]} repo(s)" \
                "(dry-run=${INPUT_DRY_RUN})"

            LAST_REPO_ID=""
            SUMMARY_ROWS=""
            # close-timeout bounds every request close mode makes, this
            # lookup included, so a Nexus that never answers cannot hang it.
            VERIFY_LIMIT=()
            if [ "$INPUT_MODE" = "close" ]; then
                VERIFY_LIMIT=(--max-time "$CLOSE_TIMEOUT")
            fi
            for RID in "${REPO_IDS[@]}"; do
                echo "INFO: Verifying staging repository ${RID}..."
                VERIFY_RC=0
                curl -sf -u "$AUTH" "${VERIFY_LIMIT[@]}" \
                    -H "Accept: application/xml" \
                    "${STAGING_API}/repository/${RID}" > /dev/null \
                    || VERIFY_RC=$?
                if [ "$VERIFY_RC" -eq 28 ]; then
                    echo "::error::Timed out after ${CLOSE_TIMEOUT}s looking" \
                        "up staging repository ${RID}"
                    exit 1
                elif [ "$VERIFY_RC" -ne 0 ]; then
                    echo "::error::Staging repository not found: ${RID}"
                    exit 1
                fi

                if [ "$INPUT_DRY_RUN" = "true" ]; then
                    echo "INFO: [dry-run] would ${INPUT_MODE} ${RID} (skipped)"
                    SUMMARY_ROWS+="| \`${RID}\` | verified (dry-run) |"$'\n'
                elif [ "$INPUT_MODE" = "close" ]; then
                    close_repository "$RID" "Close: ${INPUT_DESCRIPTION}"
                    SUMMARY_ROWS+="| \`${RID}\` | closed |"$'\n'
                else
                    if ! staging_profile_op drop "$RID" \
                        "Drop: ${INPUT_DESCRIPTION}"; then
                        echo "::error::Drop of ${RID} failed" \
                            "(HTTP ${HTTP_CODE})"
                        exit 1
                    fi
                    echo "INFO: Staging repository ${RID} dropped"
                    SUMMARY_ROWS+="| \`${RID}\` | dropped |"$'\n'
                fi
                LAST_REPO_ID="${RID}"
            done

            if [ "$INPUT_MODE" = "drop" ]; then
                REPO_URL=""
            else
                REPO_URL="${NEXUS_SERVER}/content/repositories/${LAST_REPO_ID}"
            fi
            echo "staging_repo_id=${LAST_REPO_ID}" >> "$GITHUB_OUTPUT"
            echo "staging_repo_url=${REPO_URL}" >> "$GITHUB_OUTPUT"

            {
                echo "## Nexus Staging ${ACTION_VERB} ✅"
                echo ""
                echo "| Repo ID | Result |"
                echo "|---|---|"
                printf '%s' "${SUMMARY_ROWS}"
                echo ""
                echo "_dry-run: ${INPUT_DRY_RUN}_"
            } >> "$GITHUB_STEP_SUMMARY"
        fi

branding:
  icon: "box"
  color: "blue"
